[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E402"]  # source modules bootstrap local import paths when run directly

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
